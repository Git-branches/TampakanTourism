<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>No connection — Tampakan Tourism</title>
<link rel="icon" href="assets/img/tampakan_logo.png" sizes="any">
<!--
    Deliberately self-contained: no CDN stylesheet, no icon font, no webfont.
    This is the page shown when the network is gone, so every byte it needs
    must already be on the device. A fallback page that itself fails to load
    is worse than no fallback at all.
-->
<style>
    :root {
        --ink:    #16241C;
        --muted:  #5B6B61;
        --rule:   #DCE4DE;
        --green:  #2E7D32;
        --amber:  #8A6100;
        --amber-bg: #FBF3E0;
        --ground: #F4F6F4;
        --card:   #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --ink:    #E6EDE8;
            --muted:  #9BAAA1;
            --rule:   #2C3A32;
            --green:  #7BC47F;
            --amber:  #E0B457;
            --amber-bg: #2E2716;
            --ground: #101713;
            --card:   #18211C;
        }
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--ground);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
    }

    .card {
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 2rem 1.6rem;
        max-width: 26rem;
        width: 100%;
        box-shadow: 0 12px 40px -24px rgba(0, 0, 0, .5);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        text-align: center;
    }

    .seal { width: 56px; height: 56px; border-radius: 50%; object-fit: contain; align-self: center; background: #fff; padding: 3px; }

    h1 { margin: 0; font-size: 1.35rem; line-height: 1.25; }

    p { margin: 0; color: var(--muted); font-size: .95rem; }

    .held {
        background: var(--amber-bg);
        color: var(--amber);
        border-radius: 10px;
        padding: .9rem 1rem;
        font-size: .92rem;
        font-weight: 600;
    }
    .held[hidden] { display: none; }

    button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--green);
        border: none;
        border-radius: 999px;
        padding: .8rem 1.6rem;
        cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

    .fine { font-size: .82rem; }
</style>
</head>
<body>

<div class="card">
    <img class="seal" src="assets/img/tampakan_logo.png" alt="Seal of the Municipality of Tampakan" width="56" height="56">

    <h1>You are offline</h1>

    <p>
        This page needs a connection to load. Move to where you have signal and try again —
        nothing you have already filled in has been lost.
    </p>

    <div class="held" id="held" hidden></div>

    <button type="button" id="retry">Try again</button>

    <p class="fine">
        Municipal Tourism Office · Municipality of Tampakan, South Cotabato
    </p>
</div>

<script src="assets/js/arrival-queue.js"></script>
<script>
(function () {
    'use strict';

    var held  = document.getElementById('held');
    var retry = document.getElementById('retry');

    /* The reassurance that matters most here: if the visitor already completed
       the logbook without a signal, say so plainly and by number. "You are
       offline" on its own reads as "your entry is gone". */
    if (self.ArrivalQueue) {
        ArrivalQueue.pending().then(function (rows) {
            if (rows.length === 0) { return; }

            held.hidden = false;
            held.textContent = rows.length === 1
                ? '1 visit is saved on this phone and will be sent automatically once you are back online.'
                : rows.length + ' visits are saved on this phone and will be sent automatically once you are back online.';
        }).catch(function () { /* no queue, nothing to reassure about */ });
    }

    retry.addEventListener('click', function () { location.reload(); });

    /* Reload the moment the network comes back, so nobody is left staring at
       this page after the signal has already returned. */
    self.addEventListener('online', function () { location.reload(); });
})();
</script>

</body>
</html>
